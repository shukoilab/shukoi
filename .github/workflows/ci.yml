name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-package-audit:
    name: Biome, Build & Export Map Audit
    if: github.repository == 'shukoilab/shukoi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Static Analysis & Architecture Guardrails (Biome)
        run: pnpm run lint

      - name: Build All Packages & Generate Isolated Declarations
        run: pnpm -r run build

      - name: Audit NPM Exports & Subpath Types (publint + attw)
        run: |
          pnpm dlx publint packages/core packages/api packages/mcp packages/cloudflare packages/lambda packages/selfhost packages/store-redis packages/ratelimit
          pnpm dlx @arethetypeswrong/cli --pack packages/core --profile esm-only
          pnpm dlx @arethetypeswrong/cli --pack packages/mcp --profile esm-only
          pnpm dlx @arethetypeswrong/cli --pack packages/store-redis --profile esm-only
          pnpm dlx @arethetypeswrong/cli --pack packages/ratelimit --profile esm-only

      - name: Verify Zero node:* Leakage for Edge Runtime
        run: |
          pnpm dlx esbuild packages/core/dist/index.js packages/api/dist/index.js packages/mcp/dist/http.js packages/cloudflare/dist/index.js packages/store-redis/dist/edge.js packages/ratelimit/dist/index.js \
            --bundle --platform=browser --format=esm --outdir=/tmp/edge-audit \
            --external:hono --external:@sinclair/typebox --external:@modelcontextprotocol/sdk

  quality-gates-matrix:
    name: Quality Gates (${{ matrix.runtime }})
    needs: static-and-package-audit
    if: github.repository == 'shukoilab/shukoi'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-22, bun-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.runtime == 'node-22'
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.runtime == 'bun-latest'
        with:
          bun-version: latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm -r run build

      - name: Run Vitest Quality Gates (QG-01 to QG-07 with --expose-gc)
        if: matrix.runtime == 'node-22'
        run: pnpm run test:ci

      - name: Run Quality Gates on Bun Runtime
        if: matrix.runtime == 'bun-latest'
        run: bun run test:ci

  auto-merge-release:
    name: Auto-Merge Release PR
    needs: [static-and-package-audit, quality-gates-matrix]
    if: |
      github.repository == 'shukoilab/shukoi' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Automatically Merge Verified Release PR
        run: |
          gh pr merge "$PR_NUMBER" --merge --subject "chore(release): version packages"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.SHUKOI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
