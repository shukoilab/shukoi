name: Weekly 3rd-Party Dependency Update

on:
  schedule:
    # Runs every Monday at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Version update mode (minor | latest)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - latest

concurrency:
  group: deps-weekly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-create-pr:
    name: Check 3rd-Party Updates & Open Tested PR
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App Token (If App Credentials Configured)
        id: app-token
        if: ${{ vars.SHUKOI_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SHUKOI_BOT_APP_ID }}
          private-key: ${{ secrets.SHUKOI_BOT_PRIVATE_KEY }}

      - name: Determine Bot Authentication Token
        id: bot-auth
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ secrets.SHUKOI_BOT_TOKEN || secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.bot-auth.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Scan & Bump 3rd-Party Versions Across Monorepo
        id: update-deps
        run: |
          UPDATE_MODE="${{ github.event.inputs.mode || 'minor' }}"
          pnpm dlx taze $UPDATE_MODE -r --include-peer -w | tee /tmp/taze-report.txt
          pnpm install --no-frozen-lockfile
          {
            echo 'REPORT<<EOF'
            cat /tmp/taze-report.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request (Automatically Triggers CI Quality Gates)
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.bot-auth.outputs.token }}
          commit-message: 'chore(deps): weekly 3rd-party dependency updates'
          title: 'chore(deps): weekly 3rd-party dependency updates'
          branch: chore/weekly-deps-update
          delete-branch: true
          labels: |
            dependencies
            automated-pr
          body: |
            ### Automated Weekly Dependency Check
            Pembaruan paket pihak ketiga pada monorepo `@shukoi/*` (termasuk rentang `peerDependencies`).
            Workflow **CI Quality Gates (`QG-01` s.d. `QG-07`)** otomatis berjalan pada PR ini untuk memvalidasi kompatibilitas runtime Node.js 22, Bun, dan Edge isolate.

            ```text
            ${{ steps.update-deps.outputs.REPORT }}
            ```
